plugins { id "com.android.application" }

android {
    namespace "local.cerebro"
    compileSdk 34
    defaultConfig {
        applicationId "local.cerebro"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Se firma con la clave de depuración para que el APK sea instalable sin más pasos.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sin dependencias: solo el SDK de Android (WebView, MediaRecorder, HttpURLConnection).
