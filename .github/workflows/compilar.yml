# Compila los tres binarios en GitHub (gratis en repos públicos):
#   Cerebro-x86_64.AppImage · Cerebro-windows-x64.zip · Cerebro.apk
# Al subir una etiqueta v*, o al lanzarlo a mano con una versión, los publica en Releases.
name: Compilar
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (vacío = solo compilar)"
        default: "v1.0.0"

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Cerebro.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Cerebro.apk }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco (CUDA ocupa mucho)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: empaquetar/construir-linux.sh
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Comprobar tamaño (GitHub Releases admite hasta 2 GiB por archivo)
        run: ls -la dist/Cerebro-x86_64.AppImage && test $(stat -c%s dist/Cerebro-x86_64.AppImage) -lt 2147483648
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Cerebro-x86_64.AppImage, compression-level: 0 }

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: empaquetar/construir-windows.sh
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Cerebro-windows-x64.zip, compression-level: 0 }

  publicar:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: salida, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "salida/*"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cerebro local ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
