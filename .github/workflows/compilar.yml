# Compila los tres binarios en GitHub (gratis en repos públicos):
#   Cerebro-x86_64.AppImage · Cerebro-windows-x64.zip · Cerebro.apk
# Al subir una etiqueta v* (git tag v1.0.0 && git push --tags) los publica en Releases.
name: Compilar
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Cerebro.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Cerebro.apk }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco (CUDA ocupa mucho)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: empaquetar/construir-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Cerebro-x86_64.AppImage, compression-level: 0 }

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: empaquetar/construir-windows.sh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Cerebro-windows-x64.zip, compression-level: 0 }

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: salida, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "salida/*" }
